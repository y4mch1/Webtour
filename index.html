<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Tour</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="crosshair"></div>
    <div id="status">Berjalan...</div>
    <div id="minimap">
        <img src="img/map.jpeg" alt="Peta Lokasi">
        
        <!-- Node Peta (Koordinat dalam %) -->
        <div class="map-node" style="top: 76%; left: 2%;" 
             title="Scene 1" onclick="viewer.loadScene('scene1')"></div>

        <div class="map-node" style="top: 25%; left: 8%;" 
             title="Scene 2" onclick="viewer.loadScene('scene2')"></div>

        <div class="map-node" style="top: 20%; left: 78%;" 
             title="Scene 3" onclick="viewer.loadScene('scene3')"></div>
             
        <div class="map-node" style="top: 90%; left: 90%;" 
             title="Scene 4" onclick="viewer.loadScene('scene4')"></div>
    </div>

    <div id="panorama"></div>
    <script src="script.js"></script>

</body>
</html>
