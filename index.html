<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebTour</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loading-screen">Menghubungkan ke Database</div>

    <div id="mode-container">
        <select id="viewMode" onchange="toggleMode()">
            <option value="user">User Mode</option>
            <option value="admin">Admin Mode</option>
        </select>
    </div>

    <div id="admin-panel">
        <div class="admin-tabs">
            <button class="admin-tab active" data-tab="marker" onclick="switchAdminTab('marker')">Marker</button>
            <button class="admin-tab" data-tab="sign" onclick="switchAdminTab('sign')">Papan Sign</button>
        </div>

        <div id="tab-marker" class="admin-tab-panel active">
            <h4>Marker & Polygon</h4>
            <label>Target Scene</label>
            <select id="targetSceneSelect"></select>
            <label>Icon Node</label>
            <select id="iconSelect">
                <option value="drone">Drone</option>
                <option value="star">Star</option>
            </select>
            <button id="btn-confirm" class="admin-btn" onclick="confirmAddNode()">Add Node</button>
            <label>Polygon Color</label>
            <input type="color" id="polygonColor" value="#ff4d4d">
            <button id="btn-polygon-mode" class="admin-btn" onclick="togglePolygonMode()">Polygon Mode: OFF</button>
            <div class="polygon-action-group">
                <button id="btn-polygon-save" class="admin-btn" onclick="savePolygonDraft()" disabled>Save Polygon</button>
                <button id="btn-polygon-cancel" class="admin-btn" onclick="cancelPolygonDraft()" disabled>Cancel</button>
            </div>
        </div>

        <div id="tab-sign" class="admin-tab-panel">
            <h4>Papan Sign</h4>
            <div class="sign-grid">
                <div class="sign-row">
                    <div class="sign-field">
                        <label>Title</label>
                        <input type="text" id="signTitle" placeholder="Nama proyek">
                    </div>
                    <div class="sign-color">
                        <label>Title Color</label>
                        <input type="color" id="signTitleColor" value="#1b263b">
                    </div>
                </div>
                <div class="sign-row">
                    <div class="sign-field">
                        <label>Alamat</label>
                        <input type="text" id="signAddress" placeholder="Alamat lengkap">
                    </div>
                    <div class="sign-color">
                        <label>Alamat Color</label>
                        <input type="color" id="signAddressColor" value="#f8f9fa">
                    </div>
                </div>
                <div class="sign-row">
                    <div class="sign-field">
                        <label>Luas Tanah</label>
                        <input type="text" id="signArea" placeholder="Contoh: 1200 m2">
                    </div>
                    <div class="sign-color">
                        <label>Luas Color</label>
                        <input type="color" id="signAreaColor" value="#ffe066">
                    </div>
                </div>
                <div class="sign-row single">
                    <div class="sign-field">
                        <label>Image URL</label>
                        <input type="url" id="signImageUrl" placeholder="https://...">
                    </div>
                </div>
            </div>
            <p class="sign-hint">Arahkan crosshair ke lokasi sign sebelum tekan confirm.</p>
            <div class="sign-action-group">
                <button id="btn-sign-confirm" class="admin-btn" onclick="handleAddSign()">Confirm Sign</button>
                <button id="btn-sign-cancel" class="admin-btn ghost" onclick="handleClearSignForm()">Cancel</button>
            </div>
        </div>

        <div class="admin-panel-footer">
            <button id="btn-delete-mode" class="admin-btn" onclick="toggleDeleteMode()">Delete Mode: OFF</button>
            <a href="#" id="btn-reset" onclick="resetDatabase()">Reset to Default</a>
        </div>
    </div>
    <div id="delete-popup">
        <p>Hapus Node ini?</p>
        <div class="popup-btn-group">
            <button class="popup-btn btn-confirm-del" onclick="executeDelete()">Delete</button>
            <button class="popup-btn btn-cancel-del" onclick="cancelDelete()">Cancel</button>
        </div>
    </div>
    <div id="sign-image-overlay">
        <div class="sign-image-modal">
            <button class="sign-image-close" onclick="closeSignPopup()">X</button>
            <img id="sign-popup-image" src="" alt="Sign preview">
            <div class="sign-popup-copy">
                <h3 id="sign-popup-title"></h3>
                <p id="sign-popup-address"></p>
                <p id="sign-popup-area"></p>
            </div>
        </div>
    </div>

    <div id="crosshair"></div>
    <div id="status"></div>

    <div id="minimap">
        <img src="img/map.jpeg" alt="Map">
        <div class="map-node" style="top: 76%; left: 2%;" title="Scene 1" onclick="viewer.loadScene('scene1')"></div>
        <div class="map-node" style="top: 25%; left: 8%;" title="Scene 2" onclick="viewer.loadScene('scene2')"></div>
        <div class="map-node" style="top: 20%; left: 78%;" title="Scene 3" onclick="viewer.loadScene('scene3')"></div>
        <div class="map-node" style="top: 90%; left: 90%;" title="Scene 4" onclick="viewer.loadScene('scene4')"></div>
    </div>

    <div id="panorama"></div>
    <script src="script.js"></script>
</body>
</html>
